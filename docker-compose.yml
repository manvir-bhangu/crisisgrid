services:
  db:
    image: postgis/postgis:16-3.4
    container_name: crisisgrid_db
    environment:
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: crisis
      POSTGRES_DB: crisisgrid
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: crisisgrid_redis
    ports:
      - "6380:6379"

volumes:
  pgdata: