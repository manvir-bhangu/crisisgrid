<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report an emergency</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:16px system-ui,Segoe UI,sans-serif;background:#10151c;color:#e6ebf2}
  main{max-width:640px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:4px 0 2px} .mute{color:#8d9bb0;font-size:13px}
  textarea{width:100%;min-height:96px;font:inherit;padding:10px;border-radius:8px;border:1px solid #263140;background:#0e131a;color:inherit}
  button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #263140;background:#0e131a;color:inherit;cursor:pointer}
  button.primary{background:#b3262e;border-color:#d13a42;font-weight:600;width:100%;margin-top:12px;padding:14px}
  #map{height:300px;border-radius:8px;margin:10px 0}
  #msg{margin-top:12px;padding:10px;border-radius:8px;display:none}
  .ok{background:#16452b;display:block!important}.bad{background:#5a1d20;display:block!important}
  .warn{background:#3a2f12;padding:8px 10px;border-radius:8px;font-size:13px;margin:10px 0}
</style></head><body><main>
  <h1>Report an emergency</h1>
  <div class="mute">CrisisGrid prototype · Amritsar service area</div>
  <div class="warn">This is a college project prototype and is <b>not connected to real emergency services</b>.
    In a real emergency call 112.</div>

  <label for="desc"><b>What is happening?</b></label>
  <textarea id="desc" maxlength="2000" placeholder="Example: Car collision near the bus stand, two people injured"></textarea>

  <p style="margin:12px 0 0"><b>Where?</b> Tap the map, or
    <button id="gps" type="button">Use my current location</button></p>
  <div id="map"></div>
  <div id="where" class="mute">No location selected.</div>

  <button id="send" class="primary" type="button">Send report</button>
  <div id="msg"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'k' + Date.now() + Math.random().toString(16).slice(2));

const map = L.map('map').setView([31.62, 74.8765], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap'}).addTo(map);
L.circle([31.62, 74.8765], {radius: 3000, color: '#4aa3ff', weight: 1, fillOpacity: 0.04}).addTo(map);

let pin = null;
let key = uuid();               // reused on retry so a double-tap never creates two incidents
function setPin(lat, lng) {
  if (pin) map.removeLayer(pin);
  pin = L.marker([lat, lng]).addTo(map);
  $('where').textContent = `Selected: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}
map.on('click', e => setPin(e.latlng.lat, e.latlng.lng));

function say(text, ok) { const m = $('msg'); m.textContent = text; m.className = ok ? 'ok' : 'bad'; }

$('gps').onclick = () => {
  if (!navigator.geolocation) { say('This browser cannot give your location. Tap the map instead.', false); return; }
  navigator.geolocation.getCurrentPosition(
    p => { setPin(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 16); },
    err => say('Could not get your location (' + err.message + '). Tap the map instead.', false),
    {enableHighAccuracy: true, timeout: 10000});
};

$('send').onclick = async () => {
  const description = $('desc').value.trim();
  if (description.length < 3) { say('Please describe what is happening.', false); return; }
  if (!pin) { say('Please choose the location on the map.', false); return; }
  $('send').disabled = true;
  try {
    const r = await fetch('/incidents', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({description, lat: pin.getLatLng().lat, lon: pin.getLatLng().lng, idempotency_key: key})});
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || 'Request failed');
    say(`Report received. Reference number: #${body.id}. A dispatcher will review it.`, true);
    $('desc').value = ''; if (pin) map.removeLayer(pin); pin = null;
    $('where').textContent = 'No location selected.'; key = uuid();
  } catch (e) {
    say('Could not send: ' + e.message, false);
  }
  $('send').disabled = false;
};
</script></body></html>
